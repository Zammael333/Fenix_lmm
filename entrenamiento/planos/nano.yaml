# Plano Nano: ~80.000 parámetros
# Diseñado para validación inmediata, pruebas unitarias y microagentes ultra-ligeros.
model:
  vocab_size: 512
  d_model: 64
  n_heads: 4
  n_layers: 2
  d_ff: 172
  max_seq_len: 128
  rope_theta: 10000.0
  eps: 0.000001
  tie_weights: true

training:
  batch_size: 4
  seq_len: 64
  learning_rate: 0.001
  min_learning_rate: 0.0001
  warmup_steps: 10
  max_steps: 100
  weight_decay: 0.01
  max_grad_norm: 1.0
  eval_interval: 20
  checkpoint_dir: "data/checkpoints/nano"
