# Plano Soberano: ~15.000.000 parámetros
# Modelo maestro de coordinación y orquestación general dentro del límite de 16 GB de RAM.
model:
  vocab_size: 2048
  d_model: 256
  n_heads: 8
  n_layers: 8
  d_ff: 688
  max_seq_len: 512
  rope_theta: 10000.0
  eps: 0.000001
  tie_weights: true

training:
  batch_size: 16
  seq_len: 256
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 100
  max_steps: 2000
  weight_decay: 0.01
  max_grad_norm: 1.0
  eval_interval: 100
  checkpoint_dir: "data/checkpoints/soberano"
